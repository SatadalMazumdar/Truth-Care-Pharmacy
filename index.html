<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Truth Care Pharmacy Proposal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

    :root {
      --font-serif: 'DM Serif Display', serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 15px;
      line-height: 1.6;
      scroll-behavior: smooth;
      background-color: #fafaf9;
      letter-spacing: -0.01em;
    }

    h1,
    h2,
    h3,
    h4,
    .font-serif {
      font-family: var(--font-serif);
    }

    /* Consistent body text styling */
    .body-text {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.7;
      color: #57534e;
    }

    .body-text-sm {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
      color: #57534e;
    }

    .body-text-lg {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.7;
      color: #57534e;
    }

    .label-text {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #78716c;
    }

    /* Hide scrollbar for cleaner sidebar look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Smooth selection style */
    ::selection {
      background-color: #ffedd5;
      color: #9a3412;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"DM Serif Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          fontSize: {
            'body': ['15px', { lineHeight: '1.7', fontWeight: '500' }],
            'body-sm': ['14px', { lineHeight: '1.6', fontWeight: '500' }],
            'body-lg': ['17px', { lineHeight: '1.7', fontWeight: '500' }],
            'label': ['11px', { lineHeight: '1.4', fontWeight: '600', letterSpacing: '0.08em' }],
          },
          colors: {
            gray: {
              50: '#fafaf9',
              100: '#f5f5f4',
              200: '#e7e5e4',
              300: '#d6d3d1',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-stone-50 text-stone-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
